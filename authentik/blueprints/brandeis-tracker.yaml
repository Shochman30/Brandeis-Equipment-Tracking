# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Applied automatically by Authentik at start-up (mounted at /blueprints/custom).
# Creates the tracker's groups, its proxy provider and application, and limits
# access to members of those groups. The one manual step left is adding the
# provider to the embedded outpost (see DEPLOY.md).
version: 1
metadata:
  name: Brandeis tracker
  labels:
    blueprints.goauthentik.io/description: Groups, proxy provider and application for the Brandeis tracker
context:
  app_slug: brandeis-tracker
entries:
  # On a fresh install, make sure the default flows, scope mappings and the
  # "authentik Admins" group exist before the entries below look them up.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: system/bootstrap.yaml
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: system/providers-oauth2.yaml
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: system/providers-proxy.yaml
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: default/flow-default-provider-authorization-implicit-consent.yaml
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: default/flow-default-provider-invalidation.yaml
      required: false

  # Roles. Viewers can look; editors can save changes; owners can also change
  # the Change history password. Members of "authentik Admins" count as owners.
  - model: authentik_core.group
    id: group-viewers
    state: created
    identifiers:
      name: tracker-viewers
  - model: authentik_core.group
    id: group-editors
    state: created
    identifiers:
      name: tracker-editors
  - model: authentik_core.group
    id: group-owners
    state: created
    identifiers:
      name: tracker-owners

  - model: authentik_providers_proxy.proxyprovider
    id: provider
    identifiers:
      name: Brandeis tracker
    attrs:
      mode: proxy
      external_host: !Format ["https://%s", !Env TRACKER_HOST]
      internal_host: http://tracker:8080
      internal_host_ssl_validation: false
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: hours=24
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]

  - model: authentik_core.application
    id: app
    identifiers:
      slug: !Context app_slug
    attrs:
      name: Brandeis Energization & Startup Tracker
      provider: !KeyOf provider
      meta_launch_url: !Format ["https://%s/", !Env TRACKER_HOST]
      meta_publisher: Brandeis South Campus Residence Hall
      policy_engine_mode: any

  # Only members of these groups may open the tracker.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      group: !KeyOf group-viewers
    attrs:
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      group: !KeyOf group-editors
    attrs:
      order: 1
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      group: !KeyOf group-owners
    attrs:
      order: 2
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      group: !Find [authentik_core.group, [name, authentik Admins]]
    attrs:
      order: 3
