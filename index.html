 const MAP={'\u2013':0x96,'\u2014':0x97,'\u2019':0x92,'\u2018':0x91,'\u201c':0x93,'\u201d':0x94,'\u2022':0x95,'\u00b7':0xB7,'\u2026':0x85};
 const norm=s=>String(s==null?'':s).replace(/\u2192/g,'->').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=');
 const codes=s=>{const o=[];for(const ch of norm(s)){const c=ch.codePointAt(0);o.push(MAP[ch]!=null?MAP[ch]:c<256?c:63)}return o};
 const tw=(s,b,sz)=>codes(s).reduce((a,c)=>a+(HW[b?'b':'h'][c]||556),0)*sz/1000;
 const esc=cs=>cs.map(c=>c===40||c===41||c===92?'\\'+String.fromCharCode(c):String.fromCharCode(c)).join('');
 const rgb=h=>{h=h.replace('#','');return [0,2,4].map(i=>(parseInt(h.substr(i,2),16)/255).toFixed(3)).join(' ')};
 const NAVY='#033C4E',OR='#E55A28',GREY='#5F6B73',INK='#1F2A30',BAND='#EAEEF0',LINE='#C9D0D5',TRACK='#E3E7EA',CARD='#F6F8F9';
 const pc=p=>p>=75?'#16A34A':p>=40?'#D97706':p>0?'#DC2626':'#9CA3AF';
 const pages=[];let ops,y;
 const newPage=()=>{ops=[];pages.push(ops);y=M};
 const T=(x,yy,s,o={})=>{const sz=o.size||9,b=!!o.b;let xx=x;if(o.align==='right')xx=x-tw(s,b,sz);if(o.align==='center')xx=x-tw(s,b,sz)/2;ops.push(`BT /${b?'F2':'F1'} ${sz} Tf ${rgb(o.color||INK)} rg ${xx.toFixed(2)} ${(Hh-yy).toFixed(2)} Td (${esc(codes(s))}) Tj ET`)};
 const R=(x,yy,w,h,c)=>ops.push(`${rgb(c)} rg ${x.toFixed(2)} ${(Hh-yy-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`);
 const SR=(x,yy,w,h,c,lw)=>ops.push(`${rgb(c)} RG ${lw||0.5} w ${x.toFixed(2)} ${(Hh-yy-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re S`);
 const BAR=(x,yy,w,p,h)=>{h=h||5;R(x,yy,w,h,TRACK);if(p>0)R(x,yy,w*Math.min(p,100)/100,h,pc(p))};
 const wrap=(s,w,b,sz)=>{const out=[];String(s==null?'':s).split('\n').forEach(par=>{let line='';par.split(/\s+/).forEach(wd=>{if(!wd)return;const t=line?line+' '+wd:wd;if(tw(t,b,sz)<=w||!line)line=t;else{out.push(line);line=wd}});out.push(line)});return out};
 const bottom=Hh-60;const ensure=h=>{if(y+h>bottom)newPage()};
 const para=(s,o={})=>{const sz=o.size||9,lh=sz*1.35,ind=o.indent||0;const ls=wrap(s,CW-ind,o.b,sz);ls.forEach((l,i)=>{ensure(lh);T(M+ind,y+sz,l,{size:sz,b:o.b,color:o.color});y+=lh});y+=o.after==null?3:o.after};
 const h2=s=>{ensure(40);y+=8;T(M,y+11,s,{size:12,b:true,color:NAVY});y+=19};
 const bullet=s=>{const sz=8.6,lh=11.6,ls=wrap(s,CW-12,false,sz);ensure(lh*Math.min(ls.length,3));ls.forEach((l,i)=>{ensure(lh);if(!i)T(M+2,y+sz,'\u2022',{size:sz,color:OR});T(M+12,y+sz,l,{size:sz});y+=lh});y+=2};
 const table=(cols,rows,o={})=>{const sz=7.8,lh=10,pad=4;const head=o.head!==false;
  const drawHead=()=>{if(!head)return;const hh=lh+pad*2;let x=M;R(M,y,CW,hh,BAND);cols.forEach(c=>{T(x+pad,y+pad+sz,c.t,{size:sz,b:true});x+=c.w});SR(M,y,CW,hh,LINE);y+=hh};
  ensure((head?lh+pad*2:0)+lh+pad*2+(o.keep||0));drawHead();
  rows.forEach(r=>{const cells=r.cells||r;const wr=cells.map((c,i)=>c&&c.bar!=null?[' ']:wrap(c&&c.t!=null?c.t:c,cols[i].w-pad*2,c&&c.b,sz));
   const span=r.span;const lines=span?wrap(cells[0].t,CW-pad*2,true,8.4):null;
   const rh=span?(lines.length*11+pad*2+2):Math.max(...wr.map(l=>l.length))*lh+pad*2;
   if(y+rh>bottom){newPage();drawHead()}
   if(span){R(M,y,CW,rh,r.bg||BAND);lines.forEach((l,i)=>T(M+pad,y+pad+8.4+i*11,l,{size:8.4,b:true,color:NAVY}));if(r.right)T(M+CW-pad,y+pad+8.4,r.right,{size:8.4,b:true,color:NAVY,align:'right'});SR(M,y,CW,rh,LINE);y+=rh;return}
   if(r.bg)R(M,y,CW,rh,r.bg);let x=M;
   cells.forEach((c,i)=>{const cw=cols[i].w;if(c&&c.bar!=null){BAR(x+pad,y+pad+2.5,cw-pad*2-30,c.bar);T(x+cw-pad,y+pad+sz,c.label||'',{size:sz,b:true,color:c.color||INK,align:'right'})}
    else wr[i].forEach((l,k)=>T(x+pad,y+pad+sz+k*lh,l,{size:sz,b:c&&c.b,color:c&&c.color||INK}));
    if(i)ops.push(`${rgb(LINE)} RG 0.4 w ${x.toFixed(2)} ${(Hh-y).toFixed(2)} m ${x.toFixed(2)} ${(Hh-y-rh).toFixed(2)} l S`);x+=cw});
   SR(M,y,CW,rh,LINE,0.4);y+=rh});y+=6};

 const date=view==='current'?S.date:S.history[+view].date,MS=MSTATE(),TY=S.mech.types,items=S.mech.items.filter(x=>!x.deleted);

 const norm=s=>String(s==null?'':s).replace(/\u2192/g,'->').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=');
 const codes=s=>{const o=[];for(const ch of norm(s)){const c=ch.codePointAt(0);o.push(MAP[ch]!=null?MAP[ch]:c<256?c:63)}return o};
 const tw=(s,b,sz)=>codes(s).reduce((a,c)=>a+(HW[b?'b':'h'][c]||556),0)*sz/1000;
 const esc=cs=>cs.map(c=>c===40||c===41||c===92?'\\'+String.fromCharCode(c):String.fromCharCode(c)).join('');
 const rgb=h=>{h=h.replace('#','');return [0,2,4].map(i=>(parseInt(h.substr(i,2),16)/255).toFixed(3)).join(' ')};
 const NAVY='#033C4E',OR='#E55A28',GREY='#5F6B73',INK='#1F2A30',BAND='#EAEEF0',LINE='#C9D0D5',TRACK='#E3E7EA',CARD='#F6F8F9';

 const pages=[];let ops,y;
 const newPage=()=>{ops=[];pages.push(ops);y=M};
 const T=(x,yy,s,o={})=>{const sz=o.size||9,b=!!o.b;let xx=x;if(o.align==='right')xx=x-tw(s,b,sz);if(o.align==='center')xx=x-tw(s,b,sz)/2;ops.push(`BT /${b?'F2':'F1'} ${sz} Tf ${rgb(o.color||INK)} rg ${xx.toFixed(2)} ${(Hh-yy).toFixed(2)} Td (${esc(codes(s))}) Tj ET`)};
 const R=(x,yy,w,h,c)=>ops.push(`${rgb(c)} rg ${x.toFixed(2)} ${(Hh-yy-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`);
 const SR=(x,yy,w,h,c,lw)=>ops.push(`${rgb(c)} RG ${lw||0.5} w ${x.toFixed(2)} ${(Hh-yy-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re S`);
 const BAR=(x,yy,w,p,h)=>{h=h||5;R(x,yy,w,h,TRACK);if(p>0)R(x,yy,w*Math.min(p,100)/100,h,pc(p))};
 const wrap=(s,w,b,sz)=>{const out=[];String(s==null?'':s).split('\n').forEach(par=>{let line='';par.split(/\s+/).forEach(wd=>{if(!wd)return;const t=line?line+' '+wd:wd;if(tw(t,b,sz)<=w||!line)line=t;else{out.push(line);line=wd}});out.push(line)});return out};
 const bottom=Hh-60;const ensure=h=>{if(y+h>bottom)newPage()};
 const para=(s,o={})=>{const sz=o.size||9,lh=sz*1.35,ind=o.indent||0;const ls=wrap(s,CW-ind,o.b,sz);ls.forEach((l,i)=>{ensure(lh);T(M+ind,y+sz,l,{size:sz,b:o.b,color:o.color});y+=lh});y+=o.after==null?3:o.after};

 const table=(cols,rows,o={})=>{const sz=7.8,lh=10,pad=4;const head=o.head!==false;

  rows.forEach(r=>{const cells=r.cells||r;const wr=cells.map((c,i)=>c&&c.bar!=null?[' ']:wrap(c&&c.t!=null?c.t:c,cols[i].w-pad*2,c&&c.b,sz));
